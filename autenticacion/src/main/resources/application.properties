spring.application.name=autenticacion
spring.datasource.url=jdbc:mysql://localhost:3306/db_autenticacion?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8093
# Habilitar Flyway
spring.flyway.enabled=true
# Ruta donde buscara los scripts SQL
spring.flyway.locations=classpath:db/migration
# Importante si ya tienes datos en la BD y no quieres empezar de cero
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=GestionRRHH2024SecretKeyForJWTValidationIntegrante1
jwt.expiration=86400000
