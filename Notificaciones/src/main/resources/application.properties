# Configuración del servidor
server.port=8085

# Nombre de la aplicación
spring.application.name=notificaciones

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_notificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=GestionRRHH2024SecretKeyForJWTValidationIntegrante1
jwt.expiration=86400000
